version: '3.8'

services:
  # PostgreSQL with TimescaleDB extension
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: tesla_postgres
    environment:
      POSTGRES_DB: tesla_forecasting
      POSTGRES_USER: tesla_user
      POSTGRES_PASSWORD: tesla_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    networks:
      - tesla_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesla_user -d tesla_forecasting"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and async jobs
  redis:
    image: redis:7-alpine
    container_name: tesla_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tesla_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MLflow tracking server
  mlflow:
    image: python:3.11-slim
    container_name: tesla_mlflow
    working_dir: /mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://tesla_user:tesla_password@postgres:5432/tesla_forecasting
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    networks:
      - tesla_network
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "
        pip install mlflow[extras] psycopg2-binary &&
        mlflow server 
          --backend-store-uri postgresql://tesla_user:tesla_password@postgres:5432/tesla_forecasting
          --default-artifact-root /mlflow/artifacts
          --host 0.0.0.0
          --port 5000
      "

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tesla_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://tesla_user:tesla_password@postgres:5432/tesla_forecasting
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SECRET_KEY: your-secret-key-here-change-in-production
      API_V1_STR: /api/v1
      PROJECT_NAME: Tesla Forecasting API
      ALLOWED_ORIGINS: '["http://localhost:8501", "http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    networks:
      - tesla_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    restart: unless-stopped

  # Streamlit Frontend  
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: tesla_frontend
    environment:
      BACKEND_URL: http://backend:8000
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app/frontend
    networks:
      - tesla_network
    depends_on:
      - backend
    restart: unless-stopped

  # Prefect Worker (for orchestration)
  worker:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    container_name: tesla_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://tesla_user:tesla_password@postgres:5432/tesla_forecasting
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PREFECT_API_URL: http://localhost:4200/api
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./orchestration:/app/orchestration
    networks:
      - tesla_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - orchestration
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mlflow_artifacts:

networks:
  tesla_network:
    driver: bridge