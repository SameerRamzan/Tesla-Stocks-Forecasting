name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"
  
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_DB: tesla_forecasting_test
          POSTGRES_USER: tesla_user
          POSTGRES_PASSWORD: tesla_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-asyncio pytest-cov httpx
    
    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check backend/ frontend/ orchestration/
    
    - name: Type check with mypy
      run: |
        pip install mypy
        mypy backend/ --ignore-missing-imports
    
    - name: Format check with black
      run: |
        pip install black
        black --check backend/ frontend/ orchestration/
    
    - name: Create test environment file
      run: |
        cat > .env << EOF
        DATABASE_URL=postgresql+asyncpg://tesla_user:tesla_password@localhost:5432/tesla_forecasting_test
        DATABASE_URL_SYNC=postgresql://tesla_user:tesla_password@localhost:5432/tesla_forecasting_test
        REDIS_URL=redis://localhost:6379/0
        MLFLOW_TRACKING_URI=sqlite:///test_mlflow.db
        SECRET_KEY=test-secret-key
        EOF
    
    - name: Run tests
      run: |
        pytest backend/tests/ -v --cov=backend --cov-report=xml
      env:
        DATABASE_URL: postgresql+asyncpg://tesla_user:tesla_password@localhost:5432/tesla_forecasting_test
        REDIS_URL: redis://localhost:6379/0
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
  
  build-and-test-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build backend image
      run: |
        docker build -t tesla-forecasting-backend:test -f backend/Dockerfile .
    
    - name: Build frontend image
      run: |
        docker build -t tesla-forecasting-frontend:test -f frontend/Dockerfile .
    
    - name: Test Docker Compose
      run: |
        # Create test compose file
        cat > docker-compose.test.yml << EOF
        version: '3.8'
        services:
          postgres:
            image: timescale/timescaledb:latest-pg15
            environment:
              POSTGRES_DB: tesla_forecasting_test
              POSTGRES_USER: tesla_user
              POSTGRES_PASSWORD: tesla_password
            ports:
              - "5432:5432"
          
          backend:
            image: tesla-forecasting-backend:test
            environment:
              DATABASE_URL: postgresql+asyncpg://tesla_user:tesla_password@postgres:5432/tesla_forecasting_test
              SECRET_KEY: test-secret-key
            ports:
              - "8000:8000"
            depends_on:
              - postgres
        EOF
        
        # Start services
        docker-compose -f docker-compose.test.yml up -d
        
        # Wait for services
        sleep 30
        
        # Test health endpoint
        curl -f http://localhost:8000/health || exit 1
        
        # Cleanup
        docker-compose -f docker-compose.test.yml down
  
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
  
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-and-test-docker]
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your staging deployment commands here
        # e.g., deploy to staging server, update staging database, etc.
  
  deploy-production:
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-and-test-docker, security-scan]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
        # e.g., push to container registry, deploy to cloud, run migrations, etc.
        
    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          Automated release from main branch
          - Commit: ${{ github.sha }}
          - Workflow: ${{ github.run_id }}
        draft: false
        prerelease: false